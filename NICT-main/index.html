<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NICA — Noida Intercollege Cricket Association</title>

    <meta
        name="description"
        content="NICA Cricket Association — live cricket, matches, teams, players, rankings and records."
    >

    <meta name="theme-color" content="#079b79">

    <!--
      NICA FINAL FRONTEND
      This index.html and app.js belong in the same directory.
      The script below intentionally loads the local app.js.
      All shared match state is read from /api/matches.
    -->
    <!--
      Full application containing:
        - Home
        - Live
        - Matches
        - Teams
        - Players
        - Rankings
        - Records
        - Statistics
        - Head to Head
        - Career records
        - Admin
        - Supabase multi-device support
        - 20 sec ball replay
        - 60 sec over break
        - 15 min innings break
        - full scorecard
        - format selectors

      The outer NICT-main/app.js is the old stripped-down
      browser-only version and must NOT be loaded by this page.
    -->

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>
        /*
          Small compatibility layer.
          The real theme remains style.css.
        */

        .brand-box{
            display:flex;
            align-items:center;
            gap:8px;
        }

        .brand-logo{
            width:42px;
            height:42px;
            object-fit:contain;
            border-radius:8px;
        }

        .admin-nav{
            color:#a35b00 !important;
        }

        .admin-nav::before{
            content:"🔒 ";
        }

        .desktop-nav{
            display:flex;
            align-items:center;
            gap:2px;
            flex:1;
            overflow-x:auto;
            scrollbar-width:none;
        }

        .desktop-nav::-webkit-scrollbar{
            display:none;
        }

        .desktop-nav button{
            white-space:nowrap;
        }

        .drawer{
            z-index:100;
        }

        #overlay{
            z-index:90;
        }

        /*
          Keep the main application above the page background.
        */
        #app{
            min-height:calc(100vh - 110px);
        }

        @media(max-width:800px){
            .topbar{
                padding:0 10px;
                gap:8px;
            }

            .desktop-nav{
                display:none;
            }
        }
    
        /* Navigation safety: drawer is interactive only when opened. */
        .drawer:not(.open){pointer-events:none;}
        .drawer.open{pointer-events:auto;}
        #overlay:not(.show){pointer-events:none;}
        #overlay.show{pointer-events:auto;}
    

        /* FINAL NAVIGATION SAFETY */
        .topbar{
            position:sticky !important;
            z-index:1000 !important;
        }

        .desktop-nav{
            position:relative;
            z-index:1001;
        }

        .desktop-nav button,
        .menu-btn,
        .brand{
            pointer-events:auto !important;
            position:relative;
            z-index:1002;
        }

        .menu-btn{
            display:block !important;
            margin-left:auto !important;
            flex:0 0 auto !important;
            visibility:visible !important;
            opacity:1 !important;
        }

        #drawer{
            z-index:2000 !important;
        }

        #overlay{
            z-index:1900 !important;
        }

        .drawer:not(.open){
            pointer-events:none;
        }

        .drawer.open{
            pointer-events:auto;
        }

        #overlay:not(.show){
            pointer-events:none;
        }

        #overlay.show{
            pointer-events:auto;
        }
    </style>
</head>

<body>

<!-- ==========================================================
     TOP NAVIGATION
     ========================================================== -->

<header class="topbar">

    <!-- Logo / Home -->
    <button
        type="button"
        class="brand"
        onclick="navigate('home')"
        aria-label="NICA Home"
    >
        <span class="brand-box">

            <img
                class="brand-logo"
                src="assets/NICA.png"
                alt="NICA"
                onerror="this.style.display='none'"
            >

            <span>
                <strong>NICA</strong>
                <br>
                <small>
                    NOIDA INTERCOLLEGE CRICKET ASSOCIATION
                </small>
            </span>

        </span>
    </button>

    <!-- ======================================================
         MAIN NAV
         app.js listens to [data-view]
         ====================================================== -->

    <nav
        class="desktop-nav"
        aria-label="Main navigation"
    >

        <button
            type="button"
            data-view="home"
        >
            Home
        </button>

        <button
            type="button"
            data-view="live"
        >
            Live
        </button>

        <button
            type="button"
            data-view="matches"
        >
            Matches
        </button>

        <button
            type="button"
            data-view="teams"
        >
            Teams
        </button>

        <button
            type="button"
            data-view="players"
        >
            Players
        </button>

        <button
            type="button"
            data-view="rankings"
        >
            Rankings
        </button>

        <button
            type="button"
            data-view="pointTable"
            onclick="navigate('pointTable')"
        >
            Points Table
        </button>

        <button
            type="button"
            data-view="records"
        >
            Records
        </button>

    </nav>

    <!-- ======================================================
         MENU BUTTON
         ====================================================== -->

    <button
        id="menuBtn"
        class="menu-btn"
        type="button"
        aria-label="Open NICA menu"
        aria-controls="drawer"
        aria-expanded="false"
    >
        ☰ Menu
    </button>

</header>


<!-- ==========================================================
     SIDE MENU OVERLAY
     ========================================================== -->

<div
    id="overlay"
    aria-hidden="true"
></div>


<!-- ==========================================================
     SIDE MENU / ADDITIONAL FEATURES
     ========================================================== -->

<aside
    id="drawer"
    class="drawer"
    aria-label="NICA Menu"
>

    <div class="drawer-head">

        <strong>
            NICA Menu
        </strong>

        <button
            id="closeMenu"
            type="button"
            aria-label="Close menu"
        >
            ×
        </button>

    </div>


    <!-- Statistics -->
    <button
        type="button"
        data-view="stats"
    >
        📊 Statistics
    </button>


    <!-- Head to Head -->
    <button
        type="button"
        data-view="headToHead"
    >
        ⚔️ Head to Head
    </button>


    <!-- Career -->
    <button
        type="button"
        data-view="careerRecords"
    >
        🏆 Career Records
    </button>


    <!-- Rankings -->
    <button
        type="button"
        data-view="batRankings"
    >
        🏏 Batting Rankings
    </button>

    <button
        type="button"
        data-view="bowlRankings"
    >
        🎯 Bowling Rankings
    </button>

    <button
        type="button"
        data-view="allRoundRankings"
    >
        ⭐ All-round Rankings
    </button>


    <!-- Team / fielding records -->
    <button
        type="button"
        data-view="teamRecords"
    >
        🏫 Team Records
    </button>

    <button
        type="button"
        data-view="pointTable"
    >
        📋 Points Table 2026
    </button>

    <button
        type="button"
        data-view="catchRecords"
    >
        🧤 Catch Records
    </button>


    <!-- Batting records -->
    <button
        type="button"
        data-view="centuryRecords"
    >
        💯 Most Centuries
    </button>

    <button
        type="button"
        data-view="fiftyRecords"
    >
        5️⃣ Most 50+ Scores
    </button>

    <button
        type="button"
        data-view="sixRecords"
    >
        6️⃣ Most Sixes
    </button>

    <button
        type="button"
        data-view="fourRecords"
    >
        4️⃣ Most Fours
    </button>


    <!-- Bowling records -->
    <button
        type="button"
        data-view="wicketRecords"
    >
        🎯 Most Wickets
    </button>


    <!-- ======================================================
         ADMIN
         ======================================================

         The password is NOT placed in this HTML.

         app.js performs the actual check:

             @@098

         Admin stays locked until the user enters it.
         ====================================================== -->

    <button
        type="button"
        class="admin-nav"
        data-view="admin"
    >
        Admin Panel
    </button>

</aside>


<!-- ==========================================================
     APPLICATION ROOT
     ========================================================== -->

<main id="app">
    <div class="card empty">Loading NICA Cricket Association...</div>
</main>

<script src="app.js?v=20260826-v4" defer></script>

</body>
</html>
