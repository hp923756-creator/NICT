<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NICT Cricket Centre</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#" onclick="navigate('home');return false"><span class="brand-dot" aria-hidden="true" style="display:grid;place-items:center;width:30px;height:30px;color:#fff;font-size:14px;font-weight:900;box-shadow:0 2px 5px #0b66c344;transform:rotate(-12deg)">N</span><span>NICT</span><small>NOIDA INTERCOLLEGE CRICKET TOURNAMENT</small></a>
  <nav class="desktop-nav">
    <button data-view="home">Home</button><button data-view="live">Live</button><button data-view="matches">Matches</button><button data-view="teams">Teams</button><button data-view="players">Players</button><button data-view="rankings">Rankings</button><button data-view="records">Records</button>
  </nav>
  <button class="menu-btn" id="menuBtn">☰ Menu</button>
</header>
<aside class="drawer" id="drawer">
  <div class="drawer-head"><b>NICT Menu</b><button id="closeMenu">×</button></div>
  <button data-view="home">Home</button><button data-view="live">Live Scores</button><button data-view="matches">Matches</button>
  <button data-view="teams">Teams</button><button data-view="players">Players</button>
  <button data-view="playerRankings">Player Rankings</button><button data-view="batRankings">Batsman Rankings</button>
  <button data-view="bowlRankings">Bowling Rankings</button><button data-view="allRoundRankings">All-Rounder Rankings</button>
  <button data-view="records">All Records</button><button data-view="careerRecords">Career Records</button>
  <button data-view="centuryRecords">Most Centuries</button><button data-view="fiftyRecords">Most 50+ Scores</button>
  <button data-view="sixRecords">Most Sixes</button><button data-view="fourRecords">Most Fours</button>
  <button data-view="wicketRecords">Most Wickets</button><button data-view="catchRecords">Most Catches</button>
  <button data-view="teamRecords">Team Records</button><button data-view="headToHead">Head to Head</button>
  <button data-view="stats">Stats Explorer</button><button data-view="admin">🔒 Admin</button>
</aside>
<div id="overlay"></div><main id="app"></main>
<script src="app.js"></script>
</body></html>
